  *{box-sizing:border-box;}
  body{

  h1,h2,h3,.display{ font-family:'Fraunces',Georgia,serif; text-wrap:balance; }
  .num{ font-variant-numeric:tabular-nums; }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{ background:var(--accent-soft); }

  /* ---------- shell ---------- */
  .app{ min-height:100vh; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:16px; padding:12px 20px;
  }
  .brandmark{
    width:36px;height:36px;border-radius:10px; background:linear-gradient(155deg,var(--primary),var(--primary-ink));
    display:flex;align-items:center;justify-content:center; color:#fff; font-family:'Fraunces',serif; font-weight:600; font-size:18px;
    flex:none; box-shadow:var(--shadow);
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text .t1{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; letter-spacing:.2px;}
  .brand-text .t2{ font-size:11.5px; color:var(--ink-mute); text-transform:uppercase; letter-spacing:.08em; }
  .topbar-spacer{ flex:1; }
  .lang-toggle{
    display:flex; border:1px solid var(--border-strong); border-radius:999px; padding:2px; background:var(--surface-2); flex:none;
  }
  .lang-toggle button{
    border:none; background:transparent; color:var(--ink-soft); font-size:12.5px; font-weight:700; letter-spacing:.03em;
    padding:6px 13px; border-radius:999px; cursor:pointer; transition:background .15s,color .15s;
  }
  .lang-toggle button.active{ background:var(--primary); color:#fff; }
  .theme-note{ font-size:11px; color:var(--ink-mute); }

  .tabs{
    display:flex; gap:4px; padding:0 20px; overflow-x:auto; background:var(--surface); border-bottom:1px solid var(--border);
    scrollbar-width:thin;
  }
  .tab{
    flex:none; display:flex; align-items:center; gap:7px; padding:11px 14px; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--primary); border-bottom-color:var(--primary); }
  .tab .flag{ font-size:15px; }

  main{ flex:1; padding:22px 20px 64px; max-width:1220px; margin:0 auto; width:100%; }
  .crumb{ font-size:12.5px; color:var(--ink-mute); margin-bottom:6px; }
  .crumb a{ cursor:pointer; color:var(--primary); text-decoration:none; }
  .crumb a:hover{ text-decoration:underline; }

  /* ---------- generic components ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
  .pad{ padding:18px 20px; }
  .grid{ display:grid; gap:14px; }
  .kpi-row{ grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); }
  .kpi{ padding:16px 18px; }
  .kpi .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-mute); font-weight:700; margin-bottom:8px; }
  .kpi .value{ font-family:'Fraunces',serif; font-size:25px; font-weight:600; line-height:1.05; }
  .kpi .sub{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.02em; }
  .pill.good{ background:var(--good-bg); color:var(--good-text); }
  .pill.warning{ background:var(--warning-bg); color:#8a5a00; }
  .pill.critical{ background:var(--critical-bg); color:var(--critical); }
  .pill.neutral{ background:var(--neutral-bg); color:var(--ink-mute); }

  .dot.good{ background:var(--good); } .dot.warning{ background:var(--warning); } .dot.critical{ background:var(--critical); } .dot.neutral{ background:var(--ink-mute); }

  .section-title h2{ font-size:19px; font-weight:600; margin:0; }
  .section-title .hint{ font-size:12px; color:var(--ink-mute); }

  .filiale-card{ cursor:pointer; padding:18px 20px; transition:transform .15s, box-shadow .15s; display:flex; flex-direction:column; gap:12px; }

  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

<script>
/* =========================================================================
   STATE
   ========================================================================= */
function loadLocal(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null ? fallback : v; }catch(e){ return fallback; }
}
function saveLocal(key, val){ try{ localStorage.setItem(key,val); }catch(e){} }

// Shared live state — populated from the `db` capability once it resolves.
// Never persisted inside the page itself; RUNTIME_DEFAULTS is just the shape
// used before the first snapshot arrives (or when db is unavailable).
function runtimeDefaults(){ return { users:[], actuals:{}, creditline:{}, recruitment:{}, notes:{}, activity:[], bilanTx:{}, marketing:{} }; }
let RUNTIME = runtimeDefaults();
function mergeRuntime(data){
  const d = data || {};
  const prevUsers = RUNTIME.users || []; // doGet never returns users — keep whatever admin fetched separately
  RUNTIME = {
    users: prevUsers,
    actuals: d.actuals || {},
    creditline: d.creditline || {},
    recruitment: d.recruitment || {},
    notes: d.notes || {},
    activity: d.activity || [],
    bilanTx: d.bilanTx || {},
    marketing: d.marketing || {},
  };
}

function loadUserJson(key){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
function saveUserJson(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

const STATE = {
  lang: loadLocal('rodis_lang','en'),
  view: 'overview', // 'overview' | filialeId | 'admin' | 'bilan'
  currentUser: loadUserJson('rodis_user'), // {id, username, name, role, filiales}
  myPassword: loadLocal('rodis_pw',''),    // kept locally to re-authenticate writes/admin calls
  dbReady: false,   // the backend responded at least once
  dbLoaded: false,  // first payload has arrived
  syncing: false,
  bilanCountry: null,                          // selected subsidiary on the Balance Sheet page
  bilanDate: new Date().toISOString().slice(0,10), // selected cut-off / reporting date (YYYY-MM-DD)
};

const CURRENCY_LABEL = { NGN:'NGN', XOF:'FCFA', XAF:'FCFA' };

/* =========================================================================
   BALANCE SHEET (BILAN) — categories, computed from a dated transaction
   ledger per subsidiary. Every balance below is the sum of that
   category's transactions dated on/before the chosen cut-off date.
   ========================================================================= */
const BILAN_ASSET_CATS = ['stock','avarie','cash','bank','receivables','otherAssets'];
const BILAN_LIAB_CATS = ['rodisPayable','otherPayables','otherLiabilities'];
const BILAN_ALL_CATS = BILAN_ASSET_CATS.concat(BILAN_LIAB_CATS);
const BILAN_CAT_KEY = {
  stock:'bilanStock', avarie:'bilanAvarie', cash:'bilanCash', bank:'bilanBank',
  receivables:'bilanReceivables', rodisPayable:'bilanRodisPayable',
  otherPayables:'bilanOtherPayables', otherAssets:'bilanOtherAssets', otherLiabilities:'bilanOtherLiabilities',
};
function bilanCatLabel(cat){ return t(BILAN_CAT_KEY[cat] || cat); }

/* =========================================================================
   ACCESS
   Real per-person accounts, enforced server-side (see Code.gs): every
   write and every admin action is checked there against the signed-in
   user's role and per-subsidiary access — this page's own gating is
   just what makes the UI match what the server will actually allow.
   ========================================================================= */
function isAdmin(){ return !!(STATE.currentUser && STATE.currentUser.role==='admin'); }
function filialeAccess(filialeId){
  if(!STATE.currentUser) return 'none';
  if(STATE.currentUser.role==='admin') return 'entry';
  return (STATE.currentUser.filiales && STATE.currentUser.filiales[filialeId]) || 'none';
}
function canView(filialeId){ return filialeAccess(filialeId)!=='none'; }
function canEdit(filialeId){ return filialeAccess(filialeId)==='entry'; }
function accessibleFiliales(){ return FILIALE_ORDER.filter(id=>canView(id)); }
function currentName(){
  return (STATE.currentUser && (STATE.currentUser.name||STATE.currentUser.username)) || (STATE.lang==='fr'?'Anonyme':'Anonymous');
}

/* =========================================================================
   FORMATTING
   ========================================================================= */
function nf(lang){ return new Intl.NumberFormat(lang==='fr' ? 'fr-FR' : 'en-US'); }
function fmtInt(v){ if(v===null||v===undefined||isNaN(v)) return t('na'); return nf(STATE.lang).format(Math.round(v)); }
function fmtM(v, filiale, digits){
  if(v===null||v===undefined||isNaN(v)) return t('na');
  digits = digits===undefined?1:digits;
  const cur = CURRENCY_LABEL[filiale.currency]||filiale.currency;
  return nf(STATE.lang).format(Number((v/1e6).toFixed(digits))) + ' M ' + cur;
}
function fmtFull(v, filiale){
  if(v===null||v===undefined||isNaN(v)) return t('na');
  const cur = CURRENCY_LABEL[filiale.currency]||filiale.currency;
  return nf(STATE.lang).format(Math.round(v)) + ' ' + cur;
}
function fmtPct(v, digits){
  if(v===null||v===undefined||isNaN(v)) return t('na');
  digits = digits===undefined?0:digits;
  return (v*100).toFixed(digits).replace('.', STATE.lang==='fr' ? ',' : '.') + '%';
}
function countryName(f){ return STATE.lang==='fr' ? f.countryFr : f.countryEn; }
function periodText(f){ return STATE.lang==='fr' ? f.periodFr : f.periodEn; }
function monthLabel(m){ return STATE.lang==='fr' ? m.month : m.monthEn; }
function mktLabel(item){ return STATE.lang==='fr' ? item.labelFr : item.labelEn; }
function posTitle(p){ return STATE.lang==='fr' ? p.title : (p.titleEn||p.title); }
function posLevel(p){ return STATE.lang==='fr' ? p.level : (p.levelEn||p.level); }

/* =========================================================================
   PROGRESS / STATUS LOGIC
   ========================================================================= */
function statusForRatio(ratio){
  if(ratio===null||ratio===undefined||isNaN(ratio)) return 'neutral';
  if(ratio>=0.95) return 'good';
  if(ratio>=0.80) return 'warning';
  return 'critical';
}
function statusLabel(status){
  return status==='good'?t('statusGood') : status==='warning'?t('statusWarning') : status==='critical'?t('statusCritical') : t('statusNeutral');
}
// cumulative attainment across whichever months have a reported actual
function filialeProgress(filiale){
  let cumPlanned=0, cumActual=0, n=0;
  filiale.monthly.forEach(m=>{
    const rec = RUNTIME.actuals[filiale.id+'_'+m.monthKey];
    if(rec && rec.revenueActual!==null && rec.revenueActual!==undefined && rec.revenueActual!==''){
      cumPlanned += m.revenueRodis;
      cumActual += Number(rec.revenueActual);
      n++;
    }
  });
  const ratio = n>0 ? (cumActual/cumPlanned) : null;
  return { cumPlanned, cumActual, monthsReported:n, ratio, status: statusForRatio(ratio) };
}
function creditUtil(filiale){
  const rec = RUNTIME.creditline[filiale.id];
  const outstanding = rec && rec.outstanding!==undefined && rec.outstanding!==null && rec.outstanding!=='' ? Number(rec.outstanding) : filiale.creditLine.outstanding;
  const ceiling = filiale.creditLine.proposedCeiling;
  const rate = ceiling ? outstanding/ceiling : null;
  return { outstanding, ceiling, margin: ceiling-outstanding, rate };
}
function creditStatus(rate){
  if(rate===null||rate===undefined||isNaN(rate)) return 'neutral';
  if(rate<0.70) return 'good';
  if(rate<0.88) return 'warning';
  return 'critical';
}

/* =========================================================================
   BALANCE SHEET (BILAN) — computation
   Every figure is derived, never stored directly: it's the sum of that
   subsidiary's ledger entries for a category, dated on or before the
   chosen cut-off date. Nothing to keep in sync — change the date and the
   whole balance sheet recomputes.
   ========================================================================= */
function bilanTxList(filialeId){
  return (RUNTIME.bilanTx && RUNTIME.bilanTx[filialeId]) || [];
}
function bilanBalance(filialeId, category, cutoffDate){
  return bilanTxList(filialeId)
    .filter(tx=>tx.category===category && tx.date && tx.date<=cutoffDate)
    .reduce((sum,tx)=>sum+(Number(tx.amount)||0), 0);
}
function bilanSnapshot(filialeId, cutoffDate){
  const bal = {};
  BILAN_ALL_CATS.forEach(cat=>{ bal[cat] = bilanBalance(filialeId, cat, cutoffDate); });
  const totalAssets = BILAN_ASSET_CATS.reduce((s,c)=>s+bal[c], 0);
  const totalLiabilities = BILAN_LIAB_CATS.reduce((s,c)=>s+bal[c], 0);
  return Object.assign({}, bal, {
    totalAssets, totalLiabilities, net: totalAssets - totalLiabilities,
  });
}

/* =========================================================================
   MARKETING SPEND FOLLOW-UP
   Actual spend per activity, entered per month. Keyed flatly as
   "<filialeId>_<monthKey>_<itemIndex>" (monthKey has no underscore, so
   splitting on "_" always yields exactly those three parts back).
   ========================================================================= */
function marketingKey(filialeId, monthKey, idx){ return filialeId+'_'+monthKey+'_'+idx; }
function marketingSpentAt(filialeId, monthKey, idx){
  const rec = RUNTIME.marketing[marketingKey(filialeId, monthKey, idx)];
  return rec && rec.spent!==undefined && rec.spent!==null ? Number(rec.spent) : null;
}
function marketingActivityToDate(filialeId, idx){
  let sum = 0;
  Object.keys(RUNTIME.marketing).forEach(key=>{
    const parts = key.split('_');
    const kIdx = parts.pop();
    parts.pop(); // monthKey, unused here
    const kFiliale = parts.join('_');
    if(kFiliale===filialeId && String(kIdx)===String(idx)){
      const rec = RUNTIME.marketing[key];
      if(rec && rec.spent!==undefined && rec.spent!==null) sum += Number(rec.spent);
    }
  });
  return sum;
}
</script>

<script>
/* =========================================================================
   TOASTS
   ========================================================================= */
function toast(msg, isErr){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 2600);
}

/* =========================================================================
   LIVE DATA WIRING (Google Apps Script backend)
   All shared state (actuals, credit lines, recruitment status, notes,
   activity log) lives as one JSON blob behind a small Apps Script Web
   App, backed by a Google Sheet — read openly (doGet), written only by a
   signed-in account with data-entry access to the specific subsidiary
   being changed (checked server-side in Code.gs). Every open tab polls
   the shared figures on an interval and re-renders on change.
   ========================================================================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyBHCaS5ylmAgZ-v6jomwbahGXHWlXngjSnkt9aEqEAdPeYDYq3rnoBF9jO8vSH-8qexw/exec'; // Apps Script /exec URL, baked in at build time
const POLL_MS = 6000;
let pollTimer = null;
let lastRemoteStr = null; // last JSON payload we actually rendered, to skip no-op re-renders

function gasConfigured(){ return !!GAS_URL && GAS_URL.slice(0,4)==='http'; }

function userIsTyping(){
  const el = document.activeElement;
  const tag = el && el.tagName;
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
}

async function gasCall(body){
  const res = await fetch(GAS_URL, { method:'POST', body: JSON.stringify(body) });
  return res.json();
}

async function initRemote(){
  if(!gasConfigured()){ STATE.dbReady=false; render(); return; }
  await pollOnce();
  if(!pollTimer) pollTimer = setInterval(pollOnce, POLL_MS);
}

async function pollOnce(){
  try{
    const res = await fetch(GAS_URL, { method:'GET', cache:'no-store' });
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    const str = JSON.stringify(data);
    STATE.dbReady = true;
    STATE.dbLoaded = true;
    if(str === lastRemoteStr) return; // nothing changed remotely — don't touch the DOM
    lastRemoteStr = str;
    mergeRuntime(data);
    // never blow away an in-progress edit (a field being typed, the login
    // form, ...) just because a background poll landed
    if(!userIsTyping()) render();
  }catch(e){
    // background poll failure — keep showing the last known data rather
    // than flashing an error on every missed poll
    if(!STATE.dbLoaded){ STATE.dbReady=false; render(); }
  }
}

function pushActivity(action, detail){
  RUNTIME.activity = RUNTIME.activity || [];
  RUNTIME.activity.unshift({ ts:new Date().toISOString(), user:currentName(), action, detail:detail||'' });
  if(RUNTIME.activity.length>80) RUNTIME.activity.length=80;
}

async function persist(filialeId){
  if(!gasConfigured()){ toast(t('dbUnavailable'), true); return false; }
  STATE.syncing = true;
  try{
    const out = await gasCall({
      type:'data', filialeId,
      username: STATE.currentUser && STATE.currentUser.username, password: STATE.myPassword,
      data: RUNTIME,
    });
    STATE.syncing = false;
    if(!out || !out.ok){
      toast(t('writeBlocked'), true);
      return false;
    }
    lastRemoteStr = JSON.stringify(RUNTIME); // this write is now the known-current state
    toast(t('savedNote'), false);
    return true;
  }catch(e){
    STATE.syncing = false;
    toast(t('savingErr'), true);
    return false;
  }
}

async function saveActual(filialeId, monthKey, cartonsVal, revenueVal){
  if(!canEdit(filialeId)) return;
  const cartons = cartonsVal===''||cartonsVal===undefined ? null : Number(cartonsVal);
  const revenue = revenueVal===''||revenueVal===undefined ? null : Number(revenueVal);
  const key = filialeId+'_'+monthKey;
  RUNTIME.actuals[key] = { cartonsActual: cartons, revenueActual: revenue, updatedAt:new Date().toISOString(), updatedBy: currentName() };
  pushActivity('actual', filialeId+' '+monthKey);
  render();
  await persist(filialeId);
}
async function saveCredit(filialeId, outstandingVal){
  if(!canEdit(filialeId)) return;
  const outstanding = outstandingVal===''||outstandingVal===undefined ? null : Number(outstandingVal);
  RUNTIME.creditline[filialeId] = { outstanding, updatedAt:new Date().toISOString(), updatedBy: currentName() };
  pushActivity('credit line', filialeId);
  render();
  await persist(filialeId);
}
async function saveRecruitment(filialeId, idx, status, actualDate){
  if(!canEdit(filialeId)) return;
  RUNTIME.recruitment[filialeId+'_'+idx] = { status, actualDate: actualDate||null, updatedAt:new Date().toISOString(), updatedBy: currentName() };
  pushActivity('recruitment', filialeId+' #'+idx);
  render();
  await persist(filialeId);
}
async function saveNotes(filialeId, text){
  if(!canEdit(filialeId)) return;
  RUNTIME.notes[filialeId] = { text, updatedAt:new Date().toISOString(), updatedBy: currentName() };
  pushActivity('notes', filialeId);
  render();
  await persist(filialeId);
}

/* ---------- balance sheet transactions ---------- */
async function addBilanTx(filialeId, date, category, amountVal, note){
  if(!canEdit(filialeId)) return;
  const amount = Number(amountVal);
  if(!date || !BILAN_ALL_CATS.includes(category) || !amount){ toast(t('bilanFillRequired'), true); return; }
  RUNTIME.bilanTx = RUNTIME.bilanTx || {};
  RUNTIME.bilanTx[filialeId] = RUNTIME.bilanTx[filialeId] || [];
  RUNTIME.bilanTx[filialeId].push({
    id: 'tx_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date, category, amount, note: note||'',
    enteredBy: currentName(), ts: new Date().toISOString(),
  });
  pushActivity('bilan', filialeId+' · '+bilanCatLabel(category));
  toast(t('txAdded'), false);
  render();
  await persist(filialeId);
}
async function deleteBilanTx(filialeId, txId){
  if(!canEdit(filialeId)) return;
  RUNTIME.bilanTx[filialeId] = (RUNTIME.bilanTx[filialeId]||[]).filter(tx=>tx.id!==txId);
  pushActivity('bilan-delete', filialeId);
  toast(t('txDeleted'), false);
  render();
  await persist(filialeId);
}
window.addBilanTx = addBilanTx; window.deleteBilanTx = deleteBilanTx;

/* ---------- marketing spend follow-up ---------- */
async function saveMarketingRow(filialeId, monthKey, itemCount){
  if(!canEdit(filialeId)) return;
  for(let idx=0; idx<itemCount; idx++){
    const el = document.getElementById('mk_'+marketingKey(filialeId, monthKey, idx));
    const val = el ? el.value : '';
    const key = marketingKey(filialeId, monthKey, idx);
    if(val===''||val===undefined){
      delete RUNTIME.marketing[key];
    } else {
      RUNTIME.marketing[key] = { spent:Number(val), updatedAt:new Date().toISOString(), updatedBy: currentName() };
    }
  }
  pushActivity('marketing', filialeId+' '+monthKey);
  render();
  await persist(filialeId);
}
window.saveMarketingRow = saveMarketingRow;

/* ---------- auth actions ---------- */
async function doLogin(username, password){
  if(!gasConfigured()){ showLoginError(t('dbUnavailable')); return; }
  try{
    const out = await gasCall({ type:'login', username, password });
    if(!out || !out.ok){ showLoginError(t('loginError')); return; }
    STATE.currentUser = out.user;
    STATE.myPassword = password;
    saveUserJson('rodis_user', out.user);
    saveLocal('rodis_pw', password);
    STATE.view = 'overview';
    render();
  }catch(e){
    showLoginError(t('savingErr'));
  }
}
function doLogout(){
  STATE.currentUser = null;
  STATE.myPassword = '';
  saveUserJson('rodis_user', null);
  saveLocal('rodis_pw', '');
  STATE.view = 'overview';
  render();
}
function showLoginError(msg){
  const el = document.getElementById('login-error');
  if(el){ el.textContent = msg; el.style.display='block'; }
}
window.doLogin = doLogin; window.doLogout = doLogout;

/* ---------- admin: user management (server-enforced — see Code.gs) ---------- */
async function adminCall(action, payload){
  if(!isAdmin()) return null;
  try{
    const out = await gasCall({
      type:'admin', action,
      username: STATE.currentUser.username, password: STATE.myPassword,
      payload,
    });
    if(out && out.ok && out.users){
      RUNTIME.users = out.users;
      pushActivity(action, JSON.stringify(payload).slice(0,60));
    }
    return out;
  }catch(e){
    return { ok:false, error:String(e) };
  }
}
async function refreshUsers(){
  if(!isAdmin()) return;
  try{
    const out = await gasCall({ type:'listUsers', username: STATE.currentUser.username, password: STATE.myPassword });
    if(out && out.ok) RUNTIME.users = out.users;
    render();
  }catch(e){}
}
async function adminAddUser(username, name, password, role){
  username=(username||'').trim(); name=(name||'').trim(); password=(password||'').trim();
  if(!username || !password){ toast(t('fillRequired'), true); return; }
  const out = await adminCall('addUser', { username, name, password, role });
  if(!out || !out.ok){ toast(out && out.error==='username_taken' ? t('usernameTaken') : t('savingErr'), true); return; }
  toast(t('userAdded'), false);
  render();
}
async function adminUpdateAccess(userId, filialeId, level){
  const out = await adminCall('updateAccess', { userId, filialeId, level });
  if(!out || !out.ok){ toast(t('savingErr'), true); return; }
  if(STATE.currentUser && STATE.currentUser.id===userId){
    STATE.currentUser.filiales = STATE.currentUser.filiales || {};
    if(level==='none') delete STATE.currentUser.filiales[filialeId]; else STATE.currentUser.filiales[filialeId]=level;
    saveUserJson('rodis_user', STATE.currentUser);
  }
  render();
}
async function adminUpdateRole(userId, role){
  const out = await adminCall('updateRole', { userId, role });
  if(!out || !out.ok){ toast(t('savingErr'), true); return; }
  if(STATE.currentUser && STATE.currentUser.id===userId){ STATE.currentUser.role = role==='admin'?'admin':'user'; saveUserJson('rodis_user', STATE.currentUser); }
  render();
}
async function adminResetPassword(userId, newPassword){
  newPassword=(newPassword||'').trim();
  if(!newPassword) return;
  const out = await adminCall('resetPassword', { userId, newPassword });
  if(!out || !out.ok){ toast(t('savingErr'), true); return; }
  toast(t('userUpdated'), false);
  render();
}
async function adminDeleteUser(userId){
  if(STATE.currentUser && STATE.currentUser.id===userId){ toast(t('cannotDeleteSelf'), true); return; }
  const out = await adminCall('deleteUser', { userId });
  if(!out || !out.ok){ toast(out && out.error==='cannot_delete_self' ? t('cannotDeleteSelf') : t('savingErr'), true); return; }
  toast(t('userDeleted'), false);
  render();
}
window.adminAddUser=adminAddUser; window.adminUpdateAccess=adminUpdateAccess; window.adminUpdateRole=adminUpdateRole;
window.adminResetPassword=adminResetPassword; window.adminDeleteUser=adminDeleteUser;
</script>

<script>
/* =========================================================================
   TOOLTIP
   ========================================================================= */
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function showTip(evt, html){
  const tip = document.getElementById('tooltip');
  tip.innerHTML = html;
  positionTip(evt);
  tip.style.opacity = '1';
}
function positionTip(evt){
  const tip = document.getElementById('tooltip');
  let x = evt.clientX + 16, y = evt.clientY + 16;
  const vw = window.innerWidth, vh = window.innerHeight;
  if(x + 230 > vw) x = evt.clientX - 230 - 10;
  if(y + 90 > vh) y = evt.clientY - 90;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function moveTip(evt){ if(document.getElementById('tooltip').style.opacity==='1') positionTip(evt); }
function hideTip(){ document.getElementById('tooltip').style.opacity = '0'; }
window.showTip=showTip; window.moveTip=moveTip; window.hideTip=hideTip;

/* =========================================================================
   MONTHLY PLAN VS ACTUAL — grouped bar chart (inline SVG)
   ========================================================================= */
function monthlyChart(f){
  const months = f.monthly;
  const n = months.length;
  const W = 780, H = 240, padL = 4, padR = 4, padT = 14, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const groupW = plotW / n;
  const barW = Math.min(15, groupW*0.30);

  let maxVal = 0;
  const rows = months.map(m=>{
    const rec = RUNTIME.actuals[f.id+'_'+m.monthKey];
    const actual = rec && rec.revenueActual!==null && rec.revenueActual!==undefined && rec.revenueActual!=='' ? Number(rec.revenueActual) : null;
    maxVal = Math.max(maxVal, m.revenueRodis, actual||0);
    return { m, actual };
  });
  maxVal = maxVal * 1.18 || 1;

  const yFor = v => padT + plotH - (v/maxVal)*plotH;

  let grid = '';
  [0,0.25,0.5,0.75,1].forEach(f2=>{
    const y = padT + plotH - f2*plotH;
    grid += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"/>`;
  });

  let bars = '', labels = '';
  rows.forEach((row,i)=>{
    const gx = padL + i*groupW;
    const cx = gx + groupW/2;
    const planX = cx - barW - 2;
    const actX = cx + 2;
    const planY = yFor(row.m.revenueRodis);
    const planH = (padT+plotH) - planY;
    const ratio = row.actual!==null ? row.actual/row.m.revenueRodis : null;
    const status = statusForRatio(ratio);
    const statusColor = status==='good' ? 'var(--good)' : status==='warning' ? 'var(--warning)' : status==='critical' ? 'var(--critical)' : 'var(--chart-axis)';
    const actY = row.actual!==null ? yFor(row.actual) : (padT+plotH);
    const actH = row.actual!==null ? (padT+plotH) - actY : 0;

    const tip = `<div style="font-weight:700;margin-bottom:4px">${monthLabel(row.m)}</div>`+
      `<div>${t('tblRevPlan')}: <b>${fmtM(row.m.revenueRodis, f)}</b></div>`+
      `<div>${t('tblRevActual')}: <b>${row.actual!==null ? fmtM(row.actual, f) : t('notStarted')}</b></div>`+
      (ratio!==null ? `<div>${t('tblAttain')}: <b>${fmtPct(ratio)}</b></div>` : '');

    bars += `<g onmouseenter="showTip(event,'${escapeAttr(tip)}')" onmousemove="moveTip(event)" onmouseleave="hideTip()" style="cursor:pointer">`+
      `<rect x="${(planX-barW/2).toFixed(1)}" y="${planY.toFixed(1)}" width="${barW}" height="${Math.max(planH,0).toFixed(1)}" rx="2.5" fill="none" stroke="var(--series-1)" stroke-width="1.6"/>`+
      (row.actual!==null
        ? `<rect x="${(actX-barW/2).toFixed(1)}" y="${actY.toFixed(1)}" width="${barW}" height="${Math.max(actH,0).toFixed(1)}" rx="2.5" fill="${statusColor}"/>`
        : `<rect x="${(actX-barW/2).toFixed(1)}" y="${(padT+plotH-2).toFixed(1)}" width="${barW}" height="2" rx="1" fill="var(--chart-muted)" opacity=".5"/>`)+
      `<rect x="${gx.toFixed(1)}" y="${padT}" width="${groupW.toFixed(1)}" height="${plotH}" fill="transparent"/>`+
      `</g>`;
    labels += `<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--chart-muted)">${monthLabel(row.m).split('-')[0]}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;background:var(--chart-surface);border-radius:10px;">${grid}${bars}${labels}</svg>`;
}
</script>

      <span class="li"><span class="swatch" style="border:2px solid var(--series-1);background:transparent;"></span>${t('legendPlan')}</span>
      <span class="li"><span class="swatch" style="background:var(--good)"></span>${statusLabel('good')}</span>
      <span class="li"><span class="swatch" style="background:var(--warning)"></span>${statusLabel('warning')}</span>

    <div class="card kpi"><div class="label">${t('trucksTitle')}</div><div class="value num">${parseInt(f.trucksTargetPerYear,10)} <span style="font-size:14px;color:var(--ink-mute);font-family:'Inter'">${STATE.lang==='fr'?'camions/an':'trucks/yr'}</span></div></div>
    <div class="card kpi pad" style="grid-column:span 2;">
      <div class="label">${t('clientPotentialTitle')}</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px;">
        ${(f.clientPotential||[]).map(cl=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;"><span>${cl.name}</span><b class="num">${fmtFull(cl.potential,f)}</b></div>`).join('')}

  ${f.citySplit && f.citySplit.length ? `
  <div class="section-title"><h2>${t('cityTitle')}</h2></div>
  <div class="card pad">
    ${f.citySplit.map((cs,i)=>`
      <div class="mkt-item">
        <div class="mkt-toprow"><span class="mkt-label">${STATE.lang==='fr'?cs.city:cs.cityEn}</span><span class="mkt-val num">${fmtPct(cs.share)}</span></div>

      </div>`).join('')}
  </div>` : ''}

  <div class="section-title"><h2>${t('notesTitle')}</h2></div>
  <div class="card pad">${notesPanel(f)}</div>
  `;
}

/* ---------- monthly table ---------- */
function monthlyTable(f){
  const hasCartons = f.monthly[0].cartons !== null && f.monthly[0].cartons !== undefined;
  const dis = canEdit(f.id) ? '' : 'disabled';
  let head = `<tr><th>${t('tblMonth')}</th>`;
  if(hasCartons) head += `<th>${t('tblCartonsPlan')}</th><th>${t('tblCartonsActual')}</th>`;
  head += `<th>${t('tblRevPlan')}</th><th>${t('tblRevActual')}</th><th>${t('tblDistRevPlan')}</th><th>${t('tblAttain')}</th><th>${t('tblStatus')}</th><th></th></tr>`;

  let rows='';
  f.monthly.forEach(m=>{
    const rec = RUNTIME.actuals[f.id+'_'+m.monthKey] || {};
    const cartonsActual = rec.cartonsActual!==undefined && rec.cartonsActual!==null ? rec.cartonsActual : '';
    const revenueActual = rec.revenueActual!==undefined && rec.revenueActual!==null ? rec.revenueActual : '';
    const ratio = (revenueActual!=='' && !isNaN(revenueActual)) ? Number(revenueActual)/m.revenueRodis : null;
    const status = statusForRatio(ratio);
    const cId = 'c_'+f.id+'_'+m.monthKey, rId = 'r_'+f.id+'_'+m.monthKey;
    rows += `<tr>
      <td>${monthLabel(m)}</td>
      ${hasCartons ? `<td class="num">${fmtInt(m.cartons)}</td><td><input id="${cId}" class="cell-input" type="number" value="${cartonsActual}" ${dis} placeholder="${t('na')}"/></td>` : ''}
      <td class="num">${fmtM(m.revenueRodis,f,1)}</td>
      <td><input id="${rId}" class="cell-input" type="number" value="${revenueActual}" ${dis} placeholder="${t('na')}"/></td>
      <td class="num">${fmtM(m.revenueDistributor,f,1)}</td>
      <td class="num">${ratio!==null?fmtPct(ratio):t('na')}</td>
      <td><span class="pill ${status}"><span class="dot ${status}"></span>${statusLabel(status)}</span></td>
      <td><button class="save-btn" ${dis} onclick="onSaveMonth('${f.id}','${m.monthKey}','${hasCartons?cId:''}','${rId}')">${t('save')}</button></td>
    </tr>`;
  });

  const tot = f.totals;
  rows += `<tr class="total-row">
    <td>${t('total')}</td>
    ${hasCartons ? `<td class="num">${fmtInt(tot.cartons)}</td><td></td>` : ''}
    <td class="num">${fmtM(tot.revenueRodis,f,1)}</td><td></td>
    <td class="num">${fmtM(tot.revenueDistributor,f,1)}</td>
    <td></td><td></td><td></td>
  </tr>`;

  return `<table>${head}${rows}</table>`;
}
function onSaveMonth(fid, monthKey, cId, rId){
  const cVal = cId ? document.getElementById(cId).value : '';
  const rVal = document.getElementById(rId).value;
  saveActual(fid, monthKey, cVal, rVal);
}
window.onSaveMonth = onSaveMonth;

/* ---------- recruitment table ---------- */
const REC_STATUSES = ['planned','in_progress','hired'];
function recStatusLabel(s){ return s==='hired'?t('rHired') : s==='in_progress'?t('rInProgress') : t('rPlanned'); }
function recruitmentTable(f){
  const dis = canEdit(f.id) ? '' : 'disabled';
  let head = `<tr><th>${t('rTitle')}</th><th>${t('rLevel')}</th><th>${t('rCity')}</th><th>${t('rSalary')}</th><th>${t('rHireMonth')}</th><th>${t('rStatus')}</th><th>${t('rActualDate')}</th><th></th></tr>`;
  let rows = '';
  f.recruitment.positions.forEach((pos,idx)=>{
    const rec = RUNTIME.recruitment[f.id+'_'+idx] || {};
    const status = rec.status || 'planned';
    const actualDate = rec.actualDate || '';
    const sId = 'rs_'+f.id+'_'+idx, dId = 'rd_'+f.id+'_'+idx;
    rows += `<tr>
      <td>${posTitle(pos)}</td>
      <td>${posLevel(pos)}</td>
      <td>${pos.city||t('na')}</td>
      <td class="num">${pos.salary?fmtFull(pos.salary,f):t('na')}</td>
      <td class="num">${tf('monthShort',{n:pos.hireMonth})}</td>
      <td><select id="${sId}" class="cell-input" style="width:118px" ${dis}>
        ${REC_STATUSES.map(s=>`<option value="${s}" ${s===status?'selected':''}>${recStatusLabel(s)}</option>`).join('')}
      </select></td>
      <td><input id="${dId}" class="cell-input" style="width:132px" type="date" value="${actualDate}" ${dis}/></td>
      <td><button class="save-btn" ${dis} onclick="onSaveRecruitment('${f.id}',${idx},'${sId}','${dId}')">${t('save')}</button></td>
    </tr>`;
  });
  return `<table>${head}${rows}</table>
    <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--ink-soft)">
      <span>${t('recruitmentOnceFull')}: <b class="num">${fmtFull(f.recruitment.monthlyOnceFull,f)}</b></span>
      <span>${t('recruitmentAnnual')}: <b class="num">${fmtFull(f.recruitment.annualFull,f)}</b></span>
    </div>`;
}
function onSaveRecruitment(fid, idx, sId, dId){
  const status = document.getElementById(sId).value;
  const date = document.getElementById(dId).value;
  saveRecruitment(fid, idx, status, date);
}
window.onSaveRecruitment = onSaveRecruitment;

/* ---------- marketing panel ---------- */
const SERIES_COLORS = ['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)','var(--series-5)'];
function marketingPanel(f){
  const items = f.marketing.items;
  const max = Math.max(...items.map(i=>i.monthly));
  let rows = items.map((it,i)=>`
    <div class="mkt-item">
      <div class="mkt-toprow"><span class="mkt-label">${mktLabel(it)}</span><span class="mkt-val num">${fmtFull(it.monthly,f)}</span></div>
      <div class="mkt-bar"><div style="width:${(it.monthly/max*100).toFixed(1)}%;background:${SERIES_COLORS[i%SERIES_COLORS.length]}"></div></div>
    </div>`).join('');
  return rows + `
    <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px;">
      <span>${t('marketingMonthlyTotal')}</span><b class="num">${fmtFull(f.marketing.monthlyTotal,f)}</b>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);">
      <span>${t('marketingAnnualTotal')}</span><b class="num">${fmtFull(f.marketing.annualTotal,f)}</b>
    </div>`;
}

/* ---------- marketing spend follow-up (actuals, per activity per month) ---------- */
function renderMarketingFollowup(f){
  const items = f.marketing.items;
  const dis = canEdit(f.id) ? '' : 'disabled';

  const gauges = items.map((it,idx)=>{
    const spent = marketingActivityToDate(f.id, idx);
    const annual = it.monthly*12;
    const rate = annual ? spent/annual : null;
    const status = creditStatus(rate);
    return `
    <div class="card pad">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;">${mktLabel(it)}</div>
      <div class="gauge-wrap">
        <div class="gauge-labels"><span>${t('mktSpentToDate')}</span><span class="num" style="font-weight:700">${fmtPct(rate)}</span></div>
        <div class="gauge-track"><div class="gauge-fill" style="width:${Math.min(100,(rate||0)*100).toFixed(1)}%;background:var(--${status==='good'?'good':status})"></div></div>
        <div class="gauge-labels"><span class="num">${fmtFull(spent,f)}</span><span class="num">${fmtFull(annual,f)}</span></div>
      </div>
      <div style="font-size:11px;color:var(--ink-mute);margin-top:8px;">${t('mktMonthlyBudget')}: ${fmtFull(it.monthly,f)}</div>
    </div>`;
  }).join('');

  let head = `<tr><th>${t('tblMonth')}</th>`;
  items.forEach(it=>{ head += `<th>${mktLabel(it)}</th>`; });
  head += `<th>${t('mktRowTotal')}</th><th></th></tr>`;

  const rows = f.monthly.map(m=>{
    let rowTotal = 0;
    let cells = '';
    items.forEach((it,idx)=>{
      const val = marketingSpentAt(f.id, m.monthKey, idx);
      if(val!==null) rowTotal += val;
      const cId = 'mk_'+marketingKey(f.id, m.monthKey, idx);
      cells += `<td><input id="${cId}" class="cell-input" type="number" value="${val===null?'':val}" ${dis} placeholder="${t('na')}"/></td>`;
    });
    return `<tr>
      <td>${monthLabel(m)}</td>
      ${cells}
      <td class="num">${fmtFull(rowTotal,f)}</td>
      <td><button class="save-btn" ${dis} onclick="saveMarketingRow('${f.id}','${m.monthKey}',${items.length})">${t('save')}</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="section-title"><h2>${t('mktFollowupTitle')}</h2></div>
  <p style="max-width:680px;color:var(--ink-soft);font-size:13px;line-height:1.5;margin:0 0 12px;">${t('mktFollowupSub')}</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px;">${gauges}</div>
  <div class="card table-wrap pad">
    <table>${head}${rows}</table>
  </div>`;
}

/* ---------- credit line panel ---------- */
function creditPanel(f){
  const c = creditUtil(f);
  const status = creditStatus(c.rate);
  const dis = canEdit(f.id) ? '' : 'disabled';
  const oId = 'cr_'+f.id;
  const rec = RUNTIME.creditline[f.id];
  const lastUpdate = rec && rec.updatedAt ? new Date(rec.updatedAt).toLocaleDateString(STATE.lang==='fr'?'fr-FR':'en-US') + (rec.updatedBy? ' '+t('by')+' '+rec.updatedBy:'') : '';
  return `
  <div class="gauge-wrap">
    <div class="gauge-labels"><span>${t('creditRate')}</span><span class="num" style="font-weight:700">${fmtPct(c.rate)}</span></div>
    <div class="gauge-track"><div class="gauge-fill" style="width:${Math.min(100,(c.rate||0)*100).toFixed(1)}%;background:var(--${status==='good'?'good':status})"></div></div>
    <div class="gauge-labels"><span class="num">${fmtM(c.outstanding,f)}</span><span class="num">${fmtM(c.ceiling,f)}</span></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;font-size:12.5px;">
    <div><div style="color:var(--ink-mute)">${t('creditCeiling')}</div><div class="num" style="font-weight:600">${fmtM(c.ceiling,f)}</div></div>
    <div><div style="color:var(--ink-mute)">${t('creditMargin')}</div><div class="num" style="font-weight:600">${fmtM(c.margin,f)}</div></div>
  </div>
  <div style="margin-top:14px;">
    <label class="field-label">${t('creditOutstandingEdit')}</label>
    <div style="display:flex;gap:8px;">
      <input id="${oId}" class="cell-input" style="width:100%" type="number" value="${c.outstanding}" ${dis}/>
      <button class="save-btn" ${dis} onclick="onSaveCredit('${f.id}','${oId}')">${t('save')}</button>
    </div>
    ${lastUpdate ? `<div class="access-note" style="margin-top:8px;">${t('lastUpdated')}: ${lastUpdate}</div>` : ''}
  </div>`;
}
function onSaveCredit(fid, oId){ saveCredit(fid, document.getElementById(oId).value); }
window.onSaveCredit = onSaveCredit;

/* ---------- notes panel ---------- */
function notesPanel(f){
  const dis = canEdit(f.id) ? '' : 'disabled';
  const rec = RUNTIME.notes[f.id] || {};
  const text = rec.text || '';
  const lastUpdate = rec.updatedAt ? new Date(rec.updatedAt).toLocaleString(STATE.lang==='fr'?'fr-FR':'en-US') + (rec.updatedBy? ' '+t('by')+' '+rec.updatedBy:'') : '';
  const nId = 'notes_'+f.id;
  return `
  <textarea class="notes" id="${nId}" placeholder="${t('notesPlaceholder')}" ${dis}>${text}</textarea>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
    <span class="access-note" style="border:none;background:none;padding:0;">${lastUpdate}</span>
    <button class="save-btn" ${dis} onclick="saveNotes('${f.id}', document.getElementById('${nId}').value)">${t('save')}</button>
  </div>`;
}
</script>

<script>
/* =========================================================================
   BALANCE SHEET (BILAN) — view
   A country + cut-off-date picker, a two-column Assets/Liabilities
   statement computed live from the transaction ledger, the ledger itself
   (add + history, gated by the same per-subsidiary access as everything
   else), and — admins only — a side-by-side comparison across every
   subsidiary at the same cut-off date.
   ========================================================================= */
function setBilanCountry(id){ STATE.bilanCountry = id; render(); }
function setBilanDate(val){ if(val) STATE.bilanDate = val; render(); }
window.setBilanCountry = setBilanCountry; window.setBilanDate = setBilanDate;

function renderBilanView(){
  const accessible = accessibleFiliales();
  if(!STATE.bilanCountry || !accessible.includes(STATE.bilanCountry)) STATE.bilanCountry = accessible[0];
  const f = FILIALES[STATE.bilanCountry];
  const cutoff = STATE.bilanDate;
  const snap = bilanSnapshot(f.id, cutoff);
  const editable = canEdit(f.id);

  const countrySelect = `
    <select class="cell-input" onchange="setBilanCountry(this.value)">
      ${accessible.map(id=>`<option value="${id}" ${id===f.id?'selected':''}>${FILIALES[id].flag} ${countryName(FILIALES[id])}</option>`).join('')}
    </select>`;
  const dateInput = `<input type="date" class="cell-input" value="${cutoff}" onchange="setBilanDate(this.value)"/>`;

  return `
  <div class="crumb">${t('tabBilan')}</div>
  <h1 class="display" style="font-size:26px;font-weight:600;margin:0 0 6px;">${t('bilanTitle')}</h1>
  <p style="max-width:680px;color:var(--ink-soft);font-size:13.5px;line-height:1.55;margin:0 0 14px;">${t('bilanSub')}</p>

  <div class="card pad" style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;max-width:680px;margin-bottom:6px;">
    <div><label class="field-label">${t('bilanCountry')}</label>${countrySelect}</div>
    <div><label class="field-label">${t('bilanCutoff')}</label>${dateInput}</div>
  </div>
  <div class="access-note" style="max-width:680px;">${!STATE.dbReady ? t('dbUnavailable') : (editable ? t('accessNote') : t('bilanReadOnly'))}</div>

  <div class="two-col" style="margin-top:20px;">
    <div>
      <div class="section-title" style="margin-top:0;"><h2>${t('bilanAssets')}</h2></div>
      <div class="card table-wrap pad">
        <table>
          ${BILAN_ASSET_CATS.map(cat=>bilanRow(cat, snap[cat], f)).join('')}
          <tr class="total-row"><td>${t('bilanTotalAssets')}</td><td class="num">${fmtFull(snap.totalAssets,f)}</td></tr>
        </table>
      </div>
    </div>
    <div>
      <div class="section-title" style="margin-top:0;"><h2>${t('bilanLiabilities')}</h2></div>
      <div class="card table-wrap pad">
        <table>
          ${BILAN_LIAB_CATS.map(cat=>bilanRow(cat, snap[cat], f)).join('')}
          <tr class="total-row"><td>${t('bilanTotalLiabilities')}</td><td class="num">${fmtFull(snap.totalLiabilities,f)}</td></tr>
        </table>
      </div>
      <div class="card kpi" style="margin-top:14px;">
        <div class="label">${t('bilanNetPosition')}</div>
        <div class="value num" style="color:${snap.net>=0?'var(--good-text)':'var(--critical)'}">${fmtFull(snap.net,f)}</div>
        <div class="sub">${t('bilanCutoff')} ${cutoff}</div>
      </div>
    </div>
  </div>

  <div class="section-title"><h2>${t('bilanAddTx')}</h2></div>
  <div class="card pad" style="max-width:820px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;">
      <div><label class="field-label">${t('bilanTxDate')}</label><input id="btx-date" class="cell-input" style="width:100%" type="date" value="${cutoff}" ${editable?'':'disabled'}/></div>
      <div><label class="field-label">${t('bilanTxCategory')}</label>
        <select id="btx-cat" class="cell-input" style="width:100%" ${editable?'':'disabled'}>
          ${BILAN_ASSET_CATS.concat(BILAN_LIAB_CATS).map(c=>`<option value="${c}">${bilanCatLabel(c)}</option>`).join('')}
        </select>
      </div>
      <div><label class="field-label">${t('bilanTxAmount')}</label><input id="btx-amount" class="cell-input" style="width:100%" type="number" placeholder="0" ${editable?'':'disabled'}/></div>
      <div><label class="field-label">${t('bilanTxNote')}</label><input id="btx-note" class="cell-input" style="width:100%" type="text" ${editable?'':'disabled'}/></div>
    </div>
    <div style="margin-top:10px;">
      <button class="save-btn" ${editable?'':'disabled'} onclick="onAddBilanTx('${f.id}')">${t('bilanTxAdd')}</button>
    </div>
  </div>

  <div class="section-title"><h2>${t('bilanHistory')}</h2></div>
  <div class="card table-wrap pad">${bilanHistoryTable(f)}</div>

  ${isAdmin() ? renderBilanConsolidated(cutoff) : ''}
  `;
}

function bilanRow(cat, value, f){
  return `<tr><td>${bilanCatLabel(cat)}</td><td class="num">${fmtFull(value,f)}</td></tr>`;
}

function onAddBilanTx(fid){
  const date = document.getElementById('btx-date').value;
  const cat = document.getElementById('btx-cat').value;
  const amount = document.getElementById('btx-amount').value;
  const note = document.getElementById('btx-note').value;
  addBilanTx(fid, date, cat, amount, note);
}
window.onAddBilanTx = onAddBilanTx;

function bilanHistoryTable(f){
  const editable = canEdit(f.id);
  const txs = bilanTxList(f.id).slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:(a.ts<b.ts?1:-1)) );
  if(!txs.length) return `<div style="font-size:12.5px;color:var(--ink-mute);padding:4px 0;">${t('bilanNoTx')}</div>`;
  const head = `<tr><th>${t('bilanTxDate')}</th><th>${t('bilanTxCategory')}</th><th>${t('bilanTxAmount')}</th><th style="text-align:left;">${t('bilanTxNote')}</th><th></th>${editable?'<th></th>':''}</tr>`;
  const rows = txs.map(tx=>`<tr>
    <td>${tx.date}</td>
    <td>${bilanCatLabel(tx.category)}</td>
    <td class="num">${fmtFull(tx.amount,f)}</td>
    <td style="text-align:left;white-space:normal;">${escapeAttr(tx.note||'')}</td>
    <td style="text-align:left;white-space:normal;color:var(--ink-mute);font-size:11.5px;">${tx.enteredBy?(t('bilanEnteredBy')+' '+escapeAttr(tx.enteredBy)):''}</td>
    ${editable?`<td><button class="save-btn" style="background:#b3413d" onclick="deleteBilanTx('${f.id}','${tx.id}')">${t('bilanTxDelete')}</button></td>`:''}
  </tr>`).join('');
  return `<table>${head}${rows}</table>`;
}

function renderBilanConsolidated(cutoff){
  const rows = BILAN_ASSET_CATS.concat(['totalAssets'], BILAN_LIAB_CATS, ['totalLiabilities','net']);
  return `
  <div class="section-title"><h2>${t('bilanConsolidated')}</h2></div>
  <div class="access-note" style="max-width:900px;margin-bottom:10px;">${t('bilanConsolidatedSub')}</div>
  <div class="card table-wrap pad">
    <table>
      <tr><th style="text-align:left;">${t('bilanTxCategory')}</th>${FILIALE_ORDER.map(id=>`<th>${FILIALES[id].flag} ${countryName(FILIALES[id])}</th>`).join('')}</tr>
      ${rows.map(cat=>{
        const isTotal = cat==='totalAssets'||cat==='totalLiabilities'||cat==='net';
        const label = cat==='totalAssets'?t('bilanTotalAssets') : cat==='totalLiabilities'?t('bilanTotalLiabilities') : cat==='net'?t('bilanNetPosition') : bilanCatLabel(cat);
        const cells = FILIALE_ORDER.map(id=>{
          const f2 = FILIALES[id];
          const snap2 = bilanSnapshot(id, cutoff);
          return `<td class="num">${fmtFull(snap2[cat],f2)}</td>`;
        }).join('');
        return `<tr${isTotal?' class="total-row"':''}><td style="text-align:left;">${label}</td>${cells}</tr>`;
      }).join('')}
    </table>
  </div>`;
}
</script>

<script>
/* =========================================================================
   ACCESS & ACTIVITY PANEL
   Access itself is controlled entirely by this page's own Claude share
   settings (outside this file) — this panel explains that and shows the
   shared, live activity log.
   ========================================================================= */
function renderAdminPanel(){
  const users = RUNTIME.users || [];
  return `
  <div class="crumb">${t('tabAdmin')}</div>
  <h1 class="display" style="font-size:26px;font-weight:600;margin:0 0 6px;">${t('adminTitle')}</h1>
  <p style="max-width:680px;color:var(--ink-soft);font-size:13.5px;line-height:1.55;margin:0 0 10px;">${t('adminSub')}</p>
  <div class="access-note" style="max-width:760px;">${t('adminSecurityNote')}</div>

  <div class="section-title"><h2>${t('adminAddUser')}</h2></div>
  <div class="card pad" style="max-width:680px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <input id="au-username" class="cell-input" placeholder="${t('adminUsername')}" autocomplete="off"/>
      <input id="au-name" class="cell-input" placeholder="${t('adminName')}" autocomplete="off"/>
      <input id="au-password" class="cell-input" type="password" placeholder="${t('adminPassword')}" autocomplete="new-password"/>
      <select id="au-role" class="cell-input">
        <option value="user">${t('roleUser')}</option>
        <option value="admin">${t('roleAdmin')}</option>
      </select>
    </div>
    <div style="margin-top:10px;">
      <button class="save-btn" onclick="adminAddUser(document.getElementById('au-username').value, document.getElementById('au-name').value, document.getElementById('au-password').value, document.getElementById('au-role').value); document.getElementById('au-username').value=''; document.getElementById('au-name').value=''; document.getElementById('au-password').value='';">${t('adminAddUser')}</button>
    </div>
  </div>

  <div class="section-title"><h2>${t('adminUsers')}</h2></div>
  <div style="display:flex;flex-direction:column;gap:12px;max-width:820px;">
    ${users.length ? users.map(u=>renderUserCard(u)).join('') : `<div style="font-size:12.5px;color:var(--ink-mute)">${t('adminNoActivity')}</div>`}
  </div>

  <div class="section-title"><h2>${t('adminActivity')}</h2></div>
  <div class="card pad">${renderActivityLog()}</div>
  `;
}

function renderUserCard(u){
  const isSelf = STATE.currentUser && STATE.currentUser.id===u.id;
  const accessGrid = u.role==='admin'
    ? `<div class="access-note" style="margin-top:8px;">${t('roleAdmin')} — ${t('accessEntry')} · ${FILIALE_ORDER.map(fid=>countryName(FILIALES[fid])).join(', ')}</div>`
    : `<div style="margin-top:10px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-mute);margin-bottom:6px;">${t('adminAccessPerFiliale')}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;">
          ${FILIALE_ORDER.map(fid=>{
            const f = FILIALES[fid];
            const lvl = (u.filiales && u.filiales[fid]) || 'none';
            return `<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;">
              <span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"><span class="flag">${f.flag}</span> ${countryName(f)}</span>
              <select class="cell-input" style="width:112px" onchange="adminUpdateAccess('${u.id}','${fid}',this.value)">
                <option value="none" ${lvl==='none'?'selected':''}>${t('accessNone')}</option>
                <option value="view" ${lvl==='view'?'selected':''}>${t('accessView')}</option>
                <option value="entry" ${lvl==='entry'?'selected':''}>${t('accessEntry')}</option>
              </select>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  return `
  <div class="card pad">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
      <div>
        <div style="font-weight:700;font-size:14px;">${escapeAttr(u.name||u.username)}${isSelf?` <span style="color:var(--ink-mute);font-weight:400;font-size:11.5px;">(${t('loggedInAs')})</span>`:''}</div>
        <div style="font-size:12px;color:var(--ink-mute);">@${escapeAttr(u.username)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select class="cell-input" onchange="adminUpdateRole('${u.id}', this.value)">
          <option value="user" ${u.role!=='admin'?'selected':''}>${t('roleUser')}</option>
          <option value="admin" ${u.role==='admin'?'selected':''}>${t('roleAdmin')}</option>
        </select>
        <button class="save-btn" style="background:#b3413d" ${isSelf?'disabled title="'+escapeAttr(t('cannotDeleteSelf'))+'"':''} onclick="adminDeleteUser('${u.id}')">${t('adminDelete')}</button>
      </div>
    </div>
    ${accessGrid}
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;">
      <input id="pw-${u.id}" class="cell-input" type="password" placeholder="${t('adminNewPwd')}" style="max-width:220px;" autocomplete="new-password"/>
      <button class="save-btn" onclick="const el=document.getElementById('pw-${u.id}'); adminResetPassword('${u.id}', el.value); el.value='';">${t('adminResetPwd')}</button>
    </div>
  </div>`;
}

function renderActivityLog(){
  if(!RUNTIME.activity.length) return `<div style="font-size:12.5px;color:var(--ink-mute)">${t('adminNoActivity')}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;">
    ${RUNTIME.activity.slice(0,40).map(a=>`
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;border-bottom:1px solid var(--border);padding-bottom:7px;">
        <span><b>${a.user}</b> — ${a.action}${a.detail?' · '+a.detail:''}</span>
        <span class="num" style="color:var(--ink-mute);white-space:nowrap;">${new Date(a.ts).toLocaleString(STATE.lang==='fr'?'fr-FR':'en-US')}</span>
      </div>`).join('')}
  </div>`;
}
</script>

<script>
/* =========================================================================
   INIT
   ========================================================================= */
render();
initRemote();
</script>
